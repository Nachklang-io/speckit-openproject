name: Release
# Contract: specs/006-release-engineering/contracts/release-workflow.md
# No OpenProject secrets and no MCP configuration in any job (FR-013). Only GITHUB_TOKEN is used.
on:
  push:
    tags: ["preset-v*", "extension-v*", "bundle-v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # spec-kit pin; raised deliberately (research R5).
  SPECKIT_REF: v1.1.2

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.meta.outputs.kind }}
      archive: ${{ steps.meta.outputs.archive }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Gate the tag
        id: meta
        run: |
          uv run python scripts/release.py check "$TAG" --repository "$GITHUB_REPOSITORY" > meta.json
          cat meta.json
          {
            echo "kind=$(jq -r .kind meta.json)"
            echo "version=$(jq -r .version meta.json)"
            echo "prerelease=$(jq -r .prerelease meta.json)"
            echo "archive=$(jq -r .archive meta.json)"
          } >> "$GITHUB_OUTPUT"
      - run: uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@${SPECKIT_REF}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - name: Build and verify the package archive
        if: steps.meta.outputs.kind != 'bundle'
        env:
          KIND: ${{ steps.meta.outputs.kind }}
        run: |
          uv run python scripts/release.py build "$KIND" --out dist --version "${TAG#"$KIND"-v}"
          uv run python scripts/release.py verify-archive "dist/${{ steps.meta.outputs.archive }}"
      - name: Build the bundle and its catalogs
        if: steps.meta.outputs.kind == 'bundle'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          uv run python - > components.txt <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import release, yaml
          pins = release.bundle_pins(yaml.safe_load(open("bundle/bundle.yml")))
          for tag in release.component_tags(release.parse_tag(os.environ["TAG"]), pins).values():
              print(tag.name, tag.archive)
          PY
          while read -r tag archive; do
            if ! gh release view "$tag" --json assets --jq '.assets[].name' > names.txt \
              || ! grep -qxF "$archive" names.txt; then
              echo "release: missing release: $tag" >&2
              exit 1
            fi
            gh release download "$tag" --pattern "$archive" --dir components
          done < components.txt
          uv run python scripts/release.py bundle-catalog --tag "$TAG" --archives components \
            --repository "$GITHUB_REPOSITORY" --out dist
          specify bundle validate --offline --path bundle
          specify bundle build --path bundle --output dist
          test -f "dist/$ARCHIVE"
          uv run python scripts/release.py verify-archive "dist/$ARCHIVE"
          uv run python scripts/release.py verify-text \
            dist/openproject-presets-catalog.json dist/openproject-extensions-catalog.json
      - name: Release notes
        env:
          KIND: ${{ steps.meta.outputs.kind }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p notes
          uv run python scripts/release.py notes "$KIND" "$VERSION" > notes/notes.md
          printf '\n<!-- release-commit: %s -->\n' "$GITHUB_SHA" >> notes/notes.md
          uv run python scripts/release.py verify-text notes/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/notes.md
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      KIND: ${{ needs.verify.outputs.kind }}
      ARCHIVE: ${{ needs.verify.outputs.archive }}
    steps:
      # Only for scripts/release.py publish-plan (stdlib); no dependencies are installed.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - name: Decide
        id: plan
        run: |
          # Expected assets come from the tag metadata, never from what happens to be in assets/.
          expected=("$ARCHIVE")
          if [ "$KIND" = "bundle" ]; then
            expected+=(openproject-presets-catalog.json openproject-extensions-catalog.json)
          fi
          for name in "${expected[@]}"; do
            test -f "assets/$name" || { echo "release: missing asset: $name" >&2; exit 1; }
          done
          if gh release view "$TAG" --json body,assets > release.json 2> view.err; then
            marker=$(jq -r .body release.json \
              | sed -n 's/.*<!-- release-commit: \([0-9a-f]\{40\}\) -->.*/\1/p' | head -n 1)
            mapfile -t present < <(jq -r '.assets[].name' release.json)
            python3 scripts/release.py publish-plan --tag "$TAG" --sha "$GITHUB_SHA" \
              --marker "$marker" --expected "${expected[@]}" --present "${present[@]}" > plan.json
          elif grep -q "release not found" view.err; then
            python3 scripts/release.py publish-plan --tag "$TAG" --sha "$GITHUB_SHA" \
              --expected "${expected[@]}" > plan.json
          else
            cat view.err >&2
            exit 1
          fi
          cat plan.json
          echo "action=$(jq -r .action plan.json)" >> "$GITHUB_OUTPUT"
      - name: Create release
        if: steps.plan.outputs.action == 'create'
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          mapfile -t files < <(jq -r '.upload[] | "assets/" + .' plan.json)
          gh release create "$TAG" "${files[@]}" --verify-tag --title "$TAG" \
            --notes-file notes/notes.md "${flags[@]}"
          echo "created $TAG"
      - name: Upload missing assets
        if: steps.plan.outputs.action == 'upload'
        run: |
          mapfile -t files < <(jq -r '.upload[] | "assets/" + .' plan.json)
          gh release upload "$TAG" "${files[@]}"
          echo "completed $TAG: uploaded $(jq -r '.upload | join(", ")' plan.json)"
      - name: Nothing to do
        if: steps.plan.outputs.action == 'noop'
        run: |
          echo "release exists, complete: $TAG"
